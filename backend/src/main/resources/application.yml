server:
  port: ${PORT:8080}

spring:
  application:
    name: engineering-blackbox
  web:
    resources:
      cache:
        period: 0

github:
  api-url: ${GITHUB_API_URL:-https://api.github.com}
  token: ${GITHUB_TOKEN:change_me}
  repositories: ${GITHUB_REPOSITORIES:change_me}
  polling-interval-ms: ${GITHUB_POLLING_INTERVAL_MS:180000}
  initial-events-per-repository: ${GITHUB_INITIAL_EVENTS:30}

blackbox:
  max-events: ${BLACKBOX_MAX_EVENTS:500}
